<header id="home" class="navbar-container">
  <div class="navbar-inner">
    <a class="brand">
      <div class="brand-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="icon">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v1.007a3 3 0 0 1-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0 1 15 18.257V17.25m6-12V15a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 15V5.25m18 0A2.25 2.25 0 0 0 18.75 3H5.25A2.25 2.25 0 0 0 3 5.25m18 0V12a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 12V5.25" />
        </svg>
      </div>
      <span class="brand-name">My Portfolio</span>
    </a>
    <nav class="nav-links" [class.open]="menuOpen">
      <a class="nav-link" [class.active]="activeSection === 'home'" (click)="scrollToTarget('home')">Home</a>
      <a class="nav-link" [class.active]="activeSection === 'timeline'" (click)="scrollToTarget('timeline')">My Journey</a>
      <a class="nav-link" [class.active]="activeSection === 'projects'" (click)="scrollToTarget('projects')">Projects</a>
      <a class="nav-link" [class.active]="activeSection === 'footer'" (click)="scrollToTarget('footer')">Contact</a>
    </nav>
    <div class="nav-actions">
      <div class="owner-name">Olivier Chodura</div>
      <button type="button" class="palette-trigger" (click)="palette.open()" aria-label="Open command palette">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="palette-trigger-text">Search</span>
        <kbd class="palette-trigger-kbd">Ctrl K</kbd>
      </button>
      <button type="button" class="theme-toggle" (click)="toggleTheme($event)"
              [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
        @if (theme.theme() === 'dark') {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        } @else {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        }
      </button>
    </div>
    <button class="hamburger" (click)="toggleMenu()" [class.open]="menuOpen">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
  <div class="scroll-progress-track">
    <div class="scroll-progress-bar" [style.width.%]="scrollProgress"></div>
  </div>
</header>
